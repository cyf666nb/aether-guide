    ClearTrailRequest:
      properties:
        user_id:
          type: string
          title: User Id
        scenic_id:
          type: string
          title: Scenic Id
      additionalProperties: false
      type: object
      required:
      - user_id
      - scenic_id
      title: ClearTrailRequest
    ConversationalLocationRequest:
      properties:
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 8
          - type: 'null'
          title: Idempotency Key
          description: Client-generated idempotency key for safe retries.
        scenic_id:
          type: string
          title: Scenic Id
        description:
          type: string
          maxLength: 1000
          minLength: 2
          title: Description
      additionalProperties: false
      type: object
      required:
      - scenic_id
      - description
      title: ConversationalLocationRequest
    CreateSessionRequest:
      properties:
        idempotency_key:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 8
          - type: 'null'
          title: Idempotency Key
          description: Client-generated idempotency key for safe retries.
        scenic_id:
          type: string
          minLength: 1
          title: Scenic Id
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        persona_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Persona Id
        locale:
          type: string
          title: Locale
          default: zh-CN
      additionalProperties: false
      type: object
      required:
      - scenic_id
      title: CreateSessionRequest
    DashboardOverviewDTO:
      properties:
        active_sessions:
          type: integer
          title: Active Sessions
        token_cost_usd_today:
          type: number
          title: Token Cost Usd Today
        cache_hit_rate:
          type: number
          title: Cache Hit Rate
        nps:
          type: number
          title: Nps
        latency:
          items:
            $ref: '#/components/schemas/TimedMetric'
          type: array
          title: Latency
      additionalProperties: false
      type: object
      required:
      - active_sessions
      - token_cost_usd_today
      - cache_hit_rate
      - nps
      - latency
      title: DashboardOverviewDTO
    DocumentDTO:
      properties:
        id:
          type: string
          title: Id
        scenic_id:
          type: string
          title: Scenic Id
        title:
          type: string
          title: Title
        source_uri:
          type: string
          title: Source Uri
        version:
          type: string
          title: Version
        status:
          $ref: '#/components/schemas/DocumentStatus'
        indexed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Indexed At
      additionalProperties: false
      type: object
      required:
      - id
      - scenic_id
      - title
      - source_uri
      - version
      - status
      title: DocumentDTO
    DocumentStatus:
      type: string
      enum:
      - queued
      - indexing
      - ready
      - failed
      title: DocumentStatus
    EmergencyPointDTO:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        phone:
          type: string
          title: Phone
        geo_point:
          $ref: '#/components/schemas/GeoPoint'
        walk_minutes:
          type: integer
          minimum: 0.0
          title: Walk Minutes
      additionalProperties: false
      type: object
      required:
      - id
      - name
      - phone
      - geo_point
      - walk_minutes
      title: EmergencyPointDTO
    FeedbackDTO:
      properties:
        id:
          type: string
          title: Id
        session_id:
          type: string
          title: Session Id
        accepted:
          type: boolean
          title: Accepted
      additionalProperties: false
      type: object
      required:
      - id
      - session_id
      - accepted
      title: FeedbackDTO
